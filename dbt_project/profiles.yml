ai_analyst:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics
      location: US
      keyfile: "{{ env_var('LOADER_KEY_PATH') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 5000000000